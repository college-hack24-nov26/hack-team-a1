<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cardBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0F244A" />
      <stop offset="50%" stop-color="#08142B" />
      <stop offset="100%" stop-color="#030814" />
    </radialGradient>

    <!-- Edge Highlight -->
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0066FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#002266" stop-opacity="0.8" />
    </linearGradient>

    <!-- Top Forward Ribbon -->
    <linearGradient id="topRibbon" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>

    <!-- Bottom Forward Ribbon -->
    <linearGradient id="botRibbon" x1="0%" y1="20%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B0FF" />
      <stop offset="70%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0033AA" />
    </linearGradient>

    <!-- Left Triangle Arrow -->
    <linearGradient id="leftTriangle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>

    <!-- Inner Fold Shadow -->
    <linearGradient id="foldShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001F4D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#003388" stop-opacity="0.1" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Backdrop Card -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#cardBg)" stroke="url(#edgeGlow)" stroke-width="3" />

  <!-- Ambient Light Behind Symbol -->
  <circle cx="256" cy="220" r="130" fill="#0088FF" opacity="0.25" filter="url(#ambientGlow)" />

  <!-- The 3D Folded Ribbon "B" / "TRI" Symbol -->
  <g filter="url(#ambientGlow)" transform="translate(10, -5)">
    <!-- Back Loop / Spine -->
    <path d="M 310 156 L 392 208 C 416 224 416 260 392 276 L 334 316 C 318 326 318 348 334 358 L 396 398 C 424 416 412 458 376 458 L 310 458 Z" 
          fill="#0044BB" opacity="0.85" />

    <!-- Left Geometric Play / Delta Triangle -->
    <polygon points="130,120 320,250 130,380" fill="url(#leftTriangle)" />

    <!-- Top Diagonal Fold Ribbon (Angles downwards right to form B upper loop) -->
    <polygon points="170,80 340,80 400,165 320,225 210,140" fill="url(#topRibbon)" />

    <!-- Middle Cut Shadow Overlay -->
    <polygon points="210,140 320,225 260,265 170,200" fill="url(#foldShadow)" />

    <!-- Bottom Return Ribbon (Forms the base and lower B loop) -->
    <polygon points="120,380 325,250 405,335 340,420 170,420" fill="url(#botRibbon)" />

    <!-- Inner Crisp Bevel Highlights -->
    <path d="M 130 120 L 320 250 L 120 380" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.5" />
    <path d="M 170 80 L 340 80 L 400 165" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6" />
  </g>

  <!-- Typography: BUILD TRI -->
  <g transform="translate(256, 432)" text-anchor="middle">
    <!-- BUILD (Pure White) -->
    <text x="-54" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Montserrat, Roboto, sans-serif" 
          font-size="44" font-weight="900" letter-spacing="4" fill="#FFFFFF">BUILD</text>

    <!-- TRI (Glowing Electric Cyan) -->
    <text x="66" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Montserrat, Roboto, sans-serif" 
          font-size="44" font-weight="900" letter-spacing="4" fill="#00E5FF" filter="drop-shadow(0 0 10px rgba(0,229,255,0.6))">TRI</text>
  </g>
</svg>
